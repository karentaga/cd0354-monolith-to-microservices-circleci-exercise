version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:current
    working_directory: ~/app
    steps:
      - checkout

      - setup_remote_docker:
          version: 20.10.14

      - run:
          name: Build and push Docker image
          command: |
            docker --version
            docker build -t sudkul/sample-express-app:1.0.0 .
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            docker push sudkul/sample-express-app:1.0.0
