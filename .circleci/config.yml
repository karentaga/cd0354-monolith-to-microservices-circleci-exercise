version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:20.0  # CircleCI Node.js container
    working_directory: ~/project

    steps:
      # 1. Checkout your repo
      - checkout

      # 2. Debug: list files in repo root to confirm Dockerfile exists
      - run:
          name: Verify files
          command: ls -la

      # 3. Setup Docker engine if needed
      - setup_remote_docker

      # 4. Build Docker image
      - run:
          name: Build Docker image
          command: |
            docker build -t myapp .

      # 5. Optional: run container to test
      - run:
          name: Test container
          command: |
            docker run --rm myapp node -v
