version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:current
    working_directory: ~/project

    steps:
      # 1️⃣ Checkout the repo
      - checkout

      # 2️⃣ Ensure we are on the correct branch
      - run:
          name: Checkout Example_DockerPush branch
          command: |
            git fetch origin Example_DockerPush
            git checkout Example_DockerPush

      # 3️⃣ Debug: verify Dockerfile is present
      - run:
          name: Verify Dockerfile
          command: |
            pwd
            ls -la
            ls -la Dockerfile

      # 4️⃣ Setup Docker engine
      - setup_remote_docker

      # 5️⃣ Build and push Docker image
      - run:
          name: Build and push Docker image
          command: |
            # Build the image
            docker build -t karenht/sample-express-app:1.0.0 .
            
            # Log in to Docker Hub
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            
            # Push the image
            docker push karenht/sample-express-app:1.0.0
